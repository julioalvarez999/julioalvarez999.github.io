<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Directorio de Contactos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="contenedor">
      <h1>Directorio de Contactos</h1>

      <input type="text" id="input-nombre" placeholder="Nombre" />
      <input type="text" id="input-telefono" placeholder="Teléfono" />
      <button id="btn-agregar">Agregar</button>

      <input type="text" id="input-buscar" placeholder="Buscar contacto por nombre..." />

      <ul id="lista-contactos"></ul>

      <p id="mensaje-vacio">Todavia no agregaste contactos.</p>

      <hr />
      <p id="contador">Contactos: 0</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
